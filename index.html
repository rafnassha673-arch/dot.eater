
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DOT EATER | ZYN PLAY</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}

.app {
  max-width: 500px;
  height: 100dvh;
  margin: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 4px;
}

.logo span {
  color: #f06458;
}

.icon {
  background: #222;
  border: 1px solid #444;
  color: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 20px;
}

.title {
  text-align: center;
  margin: 18px 0;
}

.title small {
  color: #777;
  letter-spacing: 3px;
}

.title h1 {
  font-size: 28px;
  letter-spacing: 4px;
  margin: 8px 0;
}

.title p {
  font-size: 12px;
  color: #888;
}

.stats {
  display: flex;
  justify-content: space-between;
  color: #888;
  font-size: 11px;
  margin-bottom: 12px;
}

.stats strong {
  color: white;
  font-size: 15px;
}

.board {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: min(90vw, 460px);
  position: relative;
  background: #030303;
  border: 1px solid #171717;
  border-radius: 14px;
  overflow: hidden;
  margin: auto 0;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.web {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 32%;
  opacity: .35;
  pointer-events: none;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  margin: 15px 0 8px;
}

.control-row {
  display: flex;
  gap: 10px;
}

.control {
  width: 48px;
  height: 42px;
  border: 1px solid #333;
  background: #151515;
  color: white;
  border-radius: 12px;
  font-size: 20px;
}

.control:active {
  background: #444;
}

.actions {
  display: flex;
  gap: 10px;
}

.actions button {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #151515;
  color: white;
  font-weight: bold;
}

.hint {
  text-align: center;
  color: #666;
  font-size: 11px;
  line-height: 1.5;
  margin: 12px 0;
}

.footer {
  text-align: center;
  color: #444;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: auto;
  padding-top: 10px;
}

.overlay {
  position: absolute;
  inset: 0;
  background: #000c;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 5;
}

.panel {
  width: 100%;
  background: #151515;
  border: 1px solid #444;
  border-radius: 18px;
  padding: 25px 18px;
  text-align: center;
}

.panel h2 {
  letter-spacing: 3px;
}

.panel p {
  color: #999;
  font-size: 13px;
  line-height: 1.6;
}

.panel button {
  background: white;
  color: black;
  border: 0;
  padding: 13px 25px;
  border-radius: 10px;
  font-weight: bold;
  width: 100%;
}

.hidden {
  display: none;
}

@media(max-height:700px) {
  .app { padding: 10px 16px; }
  .title { margin: 8px 0; }
  .title h1 { font-size: 23px; }
  .board { max-height: min(65vw, 350px); }
  .controls { margin: 8px 0; }
}
</style>
</head>

<body>

<main class="app">

<header>
  <div class="logo">ZYN<span>.</span>PLAY</div>
  <button class="icon" id="help">?</button>
</header>

<section class="title">
  <small>HALLOWEEN MINI GAME</small>
  <h1>DOT EATER</h1>
  <p>Eat the dots. Grow longer. Don't crash.</p>
</section>

<div class="stats">
  <span>SCORE <strong id="score">00</strong></span>
  <span>BEST <strong id="best">00</strong></span>
  <span>SPEED <strong id="speed">1×</strong></span>
</div>

<div class="board" id="board">

  <canvas id="game" width="600" height="600"></canvas>

  <svg class="web" viewBox="0 0 180 180"
       fill="none" stroke="#aaa" stroke-width="1">
    <path d="M0 0 L180 180 M0 0 L180 0
    M0 0 L0 180 M0 0 L180 90
    M0 0 L90 180 M0 0 L135 180"/>
    <path d="M20 10 Q50 50 10 20
    M50 10 Q75 75 20 50
    M90 15 Q100 95 40 90
    M130 20 Q130 130 70 130"/>
  </svg>

  <div class="overlay" id="startScreen">
    <div class="panel">
      <h2>READY?</h2>
      <p>Guide the snake and eat the glowing orange dots!</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>

  <div class="overlay hidden" id="endScreen">
    <div class="panel">
      <h2 id="endTitle">GAME OVER</h2>
      <p id="endText">Your game has ended.</p>
      <button id="againBtn">PLAY AGAIN</button>
    </div>
  </div>

</div>

<div class="controls">
  <button class="control" data-dir="up">↑</button>
  <div class="control-row">
    <button class="control" data-dir="left">←</button>
    <button class="control" data-dir="down">↓</button>
    <button class="control" data-dir="right">→</button>
  </div>
</div>

<div class="actions">
  <button id="pauseBtn">Ⅱ PAUSE</button>
  <button id="resetBtn">↻ RESTART</button>
</div>

<p class="hint">
  Swipe to move · Eat orange dots · Avoid walls and yourself
</p>

<div class="footer">
  A SMALL GAME BY ZYN · 2026
</div>

</main>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 20;
const CELL = 30;

let snake, food, direction, nextDirection;
let score = 0;
let best = Number(localStorage.getItem("zynBest") || 0);
let running = false;
let paused = false;
let speed = 160;
let lastTime = 0;
let accumulator = 0;

const $ = id => document.getElementById(id);

$("best").textContent = best;

function newFood() {
  let p;

  do {
    p = {
      x: Math.floor(Math.random() * SIZE),
      y: Math.floor(Math.random() * SIZE)
    };
  } while (snake.some(s => s.x === p.x && s.y === p.y));

  return p;
}

function init() {
  snake = [
    {x: 5, y: 10},
    {x: 4, y: 10},
    {x: 3, y: 10},
    {x: 2, y: 10}
  ];

  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};

  score = 0;
  speed = 160;
  food = newFood();

  updateStats();
  draw();
}

function updateStats() {
  $("score").textContent = String(score).padStart(2, "0");
  $("best").textContent = String(best).padStart(2, "0");
  $("speed").textContent = (160 / speed).toFixed(1) + "×";
}

function draw() {
  ctx.clearRect(0, 0, 600, 600);

  // Dotted background
  for (let y = 15; y < 600; y += 30) {
    for (let x = 15; x < 600; x += 30) {
      ctx.fillStyle = "#202020";
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Orange food
  ctx.save();
  ctx.shadowColor = "#ff8a22";
  ctx.shadowBlur = 22;
  ctx.fillStyle = "#ff8a22";
  ctx.beginPath();
  ctx.arc(
    food.x * CELL + 15,
    food.y * CELL + 15,
    9, 0, Math.PI * 2
  );
  ctx.fill();
  ctx.restore();

  // Snake body
  snake.slice(1).forEach((p, i) => {
    ctx.save();
    ctx.fillStyle = "#e95f55";
    ctx.shadowColor = "#ff665c";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(
      p.x * CELL + 15,
      p.y * CELL + 15,
      8, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.restore();
  });

  // Snake head
  let h = snake[0];
  let hx = h.x * CELL + 15;
  let hy = h.y * CELL + 15;

  ctx.save();
  ctx.fillStyle = "#ff665c";
  ctx.shadowColor = "#ff665c";
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(hx, hy, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#180909";

  ctx.beginPath();
  ctx.arc(hx - 4, hy - 3, 2, 0, Math.PI * 2);
  ctx.arc(hx + 4, hy - 3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function step() {
  direction = {...nextDirection};

  let head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Wall collision
  if (
    head.x < 0 || head.x >= SIZE ||
    head.y < 0 || head.y >= SIZE
  ) {
    gameOver();
    return;
  }

  const eating = head.x === food.x && head.y === food.y;

  // Self collision
  const body = eating ? snake : snake.slice(0, -1);

  if (body.some(p => p.x === head.x && p.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score++;

    if (score > best) {
      best = score;
      localStorage.setItem("zynBest", best);
    }

    food = newFood();

    speed = Math.max(65, 160 - score * 4);
    updateStats();

  } else {
    snake.pop();
  }

  draw();
}

function gameLoop(time) {
  requestAnimationFrame(gameLoop);

  if (!running || paused) return;

  let delta = Math.min(time - lastTime, 100);
  lastTime = time;
  accumulator += delta;

  if (accumulator >= speed) {
    step();
    accumulator = 0;
  }
}

function startGame() {
  init();
  running = true;
  paused = false;
  accumulator = 0;
  lastTime = performance.now();

  $("startScreen").classList.add("hidden");
  $("endScreen").classList.add("hidden");
  $("pauseBtn").textContent = "Ⅱ PAUSE";
}

function gameOver() {
  running = false;

  $("endTitle").textContent = "GAME OVER";
  $("endText").textContent =
    "Your score: " + score + " · Best: " + best;

  $("endScreen").classList.remove("hidden");
}

function setDirection(name) {
  const dirs = {
    up:    {x: 0, y: -1},
    down:  {x: 0, y: 1},
    left:  {x: -1, y: 0},
    right: {x: 1, y: 0}
  };

  const d = dirs[name];

  if (!d) return;

  if (
    d.x === -direction.x &&
    d.y === -direction.y
  ) return;

  nextDirection = d;
}

// Mobile buttons
document.querySelectorAll("[data-dir]").forEach(btn => {
  btn.addEventListener("click", () => {
    setDirection(btn.dataset.dir);
  });
});

// Keyboard controls
document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",
    w: "up",
    s: "down",
    a: "left",
    d: "right"
  };

  if (keys[e.key]) {
    e.preventDefault();
    setDirection(keys[e.key]);
  }

  if (e.key === " ") {
    e.preventDefault();
    togglePause();
  }
});

// Swipe controls
let startX = 0;
let startY = 0;

canvas.addEventListener("pointerdown", e => {
  startX = e.clientX;
  startY = e.clientY;
});

canvas.addEventListener("pointerup", e => {
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? "right" : "left");
  } else {
    setDirection(dy > 0 ? "down" : "up");
  }
});

function togglePause() {
  if (!running) return;

  paused = !paused;

  $("pauseBtn").textContent =
    paused ? "▶ RESUME" : "Ⅱ PAUSE";

  lastTime = performance.now();
  accumulator = 0;
}

$("startBtn").onclick = startGame;
$("againBtn").onclick = startGame;
$("resetBtn").onclick = startGame;
$("pauseBtn").onclick = togglePause;

$("help").onclick = () => {
  alert(
    "DOT EATER\n\n" +
    "Swipe to control the snake.\n" +
    "Eat orange dots to grow.\n" +
    "Avoid walls and your own body!"
  );
};

init();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
